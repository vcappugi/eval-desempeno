<!-- MODAL: DEPARTAMENTO -->
<dialog id="departamentoModal">
  <article style="width: 100%; max-width: 450px;">
    <header>
      <button aria-label="Close" rel="prev" onclick="closeModal('departamentoModal')"></button>
      <span id="departamentoModalTitle" style="font-weight: 700; font-size: 1.25rem;">Agregar Unidad Administrativa</span>
    </header>
    <form id="departamentoForm" onsubmit="saveDepartamento(event)">
      <input type="hidden" id="departamentoIdInput">
      
      <label for="depNombre">
        Nombre de Unidad Administrativa
        <input type="text" id="depNombre" required placeholder="Ej. Recursos Humanos, Operaciones...">
      </label>
      
      <label for="depEmpresa">
        Empresa
        <input type="text" id="depEmpresa" required placeholder="Ej. Corporación BEL...">
      </label>
      
      <footer style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
        <button type="button" class="outline secondary" onclick="closeModal('departamentoModal')">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </footer>
    </form>
  </article>
</dialog>
