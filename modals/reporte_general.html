<!-- MODAL: REPORTE GENERAL POR FECHA -->
<dialog id="reporteGeneralModal">
  <article style="width: 100%; max-width: 900px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;">
    <header>
      <button aria-label="Close" rel="prev" onclick="closeModal('reporteGeneralModal')"></button>
      <span style="font-weight: 700; font-size: 1.25rem;"><i class="fa-solid fa-file-invoice text-primary"></i> Reporte Consolidado de Evaluaciones</span>
    </header>
    
    <div style="flex-grow: 1; overflow-y: auto; padding: 1rem 0;">
      <div style="background-color: var(--primary-focus); border-left: 5px solid var(--primary); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: flex; justify-content: space-between;">
        <div>Fecha de Evaluación: <strong id="repGenFechaLabel">-</strong></div>
        <div>Total Trabajadores: <strong id="repGenTotalLabel">-</strong></div>
      </div>
      
      <div class="table-wrapper" style="max-height: 450px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px;">
        <table style="margin-bottom: 0;">
          <thead>
            <tr>
              <th>Cédula</th>
              <th>Nombre</th>
              <th>Departamento</th>
              <th>Supervisor Evaluador</th>
              <th style="text-align: right; width: 180px;">Total Evaluación</th>
            </tr>
          </thead>
          <tbody id="reporteGeneralTableBody">
            <!-- Se carga dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
    
    <footer style="display: flex; gap: 0.5rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border-color); margin-top: 0;">
      <button class="outline secondary" onclick="closeModal('reporteGeneralModal')" style="margin-bottom: 0;">Cerrar</button>
      <button class="outline" onclick="printReporteGeneralDesdeModal()" style="margin-bottom: 0; border-color: var(--primary); color: var(--primary);">
        <i class="fa-solid fa-print"></i> Imprimir
      </button>
      <button class="primary" onclick="exportReporteGeneralExcel()" style="margin-bottom: 0;">
        <i class="fa-solid fa-file-excel"></i> Descargar Excel
      </button>
    </footer>
  </article>
</dialog>
